name: KataGo Cloud Engine
on:
  push:
    paths:
      - "cloud/**"
      - ".github/workflows/katago-cloud.yml"
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/katago-cloud.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: katago-cloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q katago_cloud tests
      - run: PYTHONPATH=. pytest -q
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: cloud
          file: cloud/Dockerfile
          push: false
          tags: katago-cloud-engine:ci
