name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Check bundled source and models
        run: |
          python3 tools/check_integrity.py
          python3 -m pip install -r tools/portable-model-requirements.txt
          python3 -m unittest discover -s tools/tests
      - name: Build and check CPU-capable APK
        run: |
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt/3"
            if ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; retrying in 20 seconds to tolerate transient repository resolution failures."
              sleep 20
            fi
          done
          exit 1
      - name: Upload KataGo Master APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KataGo-Master-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Download and verify Transformer model
        run: |
          MODEL=tf2-b10c384-s2941M-d5872M.kdmodel
          curl --fail --location --retry 3 --retry-delay 3 --max-time 600 "https://github.com/zhzy0077/KataDroid/releases/download/v1.1.0-rc.1/tf2-b10c384-s2941M-d5872M.kdmodel" -o "$RUNNER_TEMP/$MODEL"
          echo "4e88cc28ee362dca5b5ba8c494017932e5c0b2c433b0cde15bbaddde73b1cb80  $RUNNER_TEMP/$MODEL" | sha256sum --check
          echo "MODEL_PATH=$RUNNER_TEMP/$MODEL" >> "$GITHUB_ENV"
      - name: Run instrumented tests and capture diagnostics
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: yes
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -cores 2 -memory 4096
          disable-animations: true
          script: |
            set -eu
            mkdir -p test-diagnostics
            adb shell getprop sys.boot_completed > test-diagnostics/emulator-health.txt
            adb shell cmd package list packages > test-diagnostics/package-service-health.txt
            # Remove snapshot leftovers so a stale debug signature cannot block installation.
            adb uninstall io.github.zhzy0077.katadroid >/dev/null 2>&1 || true
            adb uninstall io.github.zhzy0077.katadroid.test >/dev/null 2>&1 || true
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb push "$MODEL_PATH" /data/local/tmp/tf2-b10c384-s2941M-d5872M.kdmodel
            adb shell run-as io.github.zhzy0077.katadroid mkdir -p files
            adb shell run-as io.github.zhzy0077.katadroid cp /data/local/tmp/tf2-b10c384-s2941M-d5872M.kdmodel files/
            adb shell run-as io.github.zhzy0077.katadroid ls -l files/tf2-b10c384-s2941M-d5872M.kdmodel
            adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            set +e
            adb shell am instrument -w -r -e class io.github.zhzy0077.katadroid.SearchThreadStressTest,io.github.zhzy0077.katadroid.ModelBenchmarkTest,io.github.zhzy0077.katadroid.GpuPrecisionBenchmarkTest,io.github.zhzy0077.katadroid.OptionalModelIntegrationTest -e modelPackage tf2-b10c384-s2941M-d5872M.kdmodel io.github.zhzy0077.katadroid.test/androidx.test.runner.AndroidJUnitRunner > test-diagnostics/instrumented-tests.log 2>&1
            test_exit=$?
            set -e
            echo "instrumentation_exit=$test_exit" > test-diagnostics/instrumented-tests.exitcode
            adb logcat -d -v threadtime > test-diagnostics/emulator-logcat.txt 2>&1
            cat test-diagnostics/instrumented-tests.log
            exit "$test_exit"
      - name: Upload emulator test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KataGo-emulator-test-diagnostics
          path: test-diagnostics/
          if-no-files-found: warn
          retention-days: 14
