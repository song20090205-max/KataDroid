name: Android
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833' # Command-line Tools 23.0
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Check bundled source and models
        run: |
          python3 tools/check_integrity.py
          python3 -m pip install -r tools/portable-model-requirements.txt
          python3 -m unittest discover -s tools/tests
      - name: Build and check CPU-capable APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      # Save the APK before emulator tests so it survives a regression-test failure.
      - name: Upload KataGo Master APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KataGo-Master-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run search-thread, model-speed and transformer CPU tests
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: yes
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.zhzy0077.katadroid.SearchThreadStressTest --console=plain
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.zhzy0077.katadroid.ModelBenchmarkTest --console=plain

            MODEL=tf2-b10c384-s2941M-d5872M.kdmodel
            URL=https://github.com/zhzy0077/KataDroid/releases/download/v1.1.0-rc.1/$MODEL
            curl --fail --location --retry 3 --retry-delay 3 --max-time 600 "$URL" -o "/tmp/$MODEL"
            echo "4e88cc28ee362dca5b5ba8c494017932e5c0b2c433b0cde15bbaddde73b1cb80  /tmp/$MODEL" | sha256sum --check -
            adb shell mkdir -p /sdcard/Android/data/io.github.zhzy0077.katadroid/files
            adb push "/tmp/$MODEL" /sdcard/Android/data/io.github.zhzy0077.katadroid/files/
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.zhzy0077.katadroid.OptionalModelIntegrationTest -Pandroid.testInstrumentationRunnerArguments.modelPackage="$MODEL" --console=plain
