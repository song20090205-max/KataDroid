name: Android
on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "tools/check_integrity.py"
      - "tools/portable-model-requirements.txt"
      - "tools/tests/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "tools/check_integrity.py"
      - "tools/portable-model-requirements.txt"
      - "tools/tests/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/portable-model-requirements.txt

      # Install only the SDK pieces needed for Kotlin/resource preflight.
      # Delay the large NDK/CMake download until the cheap checks pass.
      - name: Install minimal Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Fast source and model checks
        run: |
          python3 tools/check_integrity.py
          python3 -m pip install -r tools/portable-model-requirements.txt
          python3 -m unittest discover -s tools/tests

      # This catches Kotlin syntax/type errors before downloading the NDK
      # or running native compilation, lint, instrumentation, and packaging.
      - name: Kotlin compile preflight (fail fast)
        run: ./gradlew :app:compileDebugKotlin --no-daemon --console=plain

      - name: Install native Android toolchain
        run: sdkmanager 'ndk;28.2.13676358' 'cmake;3.22.1'

      # Keep these as separate commands: the first failing stage stops the job.
      # Gradle's setup action caches downloaded dependencies between runs.
      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon --console=plain

      - name: Build APK and instrumentation APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --console=plain

      - name: Upload KataGo Master APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KataGo-Master-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

      # Emulator boot is intentionally excluded from every feature-branch push.
      # Run it on the protected mainline or explicitly via workflow_dispatch.
      - name: Run native board smoke test and capture diagnostics
        if: success() && (github.ref == 'refs/heads/katago-master' || github.event_name == 'workflow_dispatch')
        timeout-minutes: 50
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: yes
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -cores 4 -memory 3072
          disable-animations: true
          script: |
            set -eu
            mkdir -p test-diagnostics
            adb shell getprop sys.boot_completed > test-diagnostics/emulator-health.txt
            package_ready=0; for attempt in 1 2 3 4 5 6; do if adb shell cmd package list packages > test-diagnostics/package-service-health.txt 2>&1; then package_ready=1; break; fi; echo "Package manager not ready (attempt $attempt/6)."; sleep 10; done; if [ "$package_ready" -ne 1 ]; then adb logcat -d -v threadtime > test-diagnostics/emulator-startup-failure.log 2>&1 || true; exit 1; fi
            adb uninstall io.github.zhzy0077.katadroid >/dev/null 2>&1 || true
            adb uninstall io.github.zhzy0077.katadroid.test >/dev/null 2>&1 || true
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            if timeout 300 adb shell am instrument -w -r -e class io.github.zhzy0077.katadroid.EngineIntegrationTest#officialRulesHandleCapturesSuicideKoAndPassesAndReplayEveryDemoBranch io.github.zhzy0077.katadroid.test/androidx.test.runner.AndroidJUnitRunner > test-diagnostics/instrumented-tests.log 2>&1; then test_exit=0; else test_exit=$?; fi; echo "instrumentation_exit=$test_exit" > test-diagnostics/instrumented-tests.exitcode; adb logcat -d -v threadtime > test-diagnostics/emulator-logcat.txt 2>&1 || true; cat test-diagnostics/instrumented-tests.log; exit "$test_exit"

      - name: Upload emulator test diagnostics
        if: always() && (github.ref == 'refs/heads/katago-master' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: KataGo-emulator-test-diagnostics
          path: test-diagnostics/
          if-no-files-found: warn
          retention-days: 14
