# Temporary Cloudflare Quick Tunnel for smoke tests only.
# No Cloudflare account token or custom domain is required.
# Start alongside docker-compose.yml:
# docker compose --env-file .env -f docker-compose.yml -f docker-compose.quick-tunnel.yml up --build -d
# Read the temporary https://*.trycloudflare.com URL from cloudflared logs.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: katago-cloudflared-quick
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://katago-cloud:8080
    depends_on:
      - katago-cloud
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
